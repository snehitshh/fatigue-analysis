<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>FatigueIDPro — Scroll Study</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --cyan:#45c8e6; --blue:#3a8cff; --bg:#0a1626; --panel:rgba(16,30,52,0.92); --border:rgba(120,170,235,0.24); --muted:rgba(206,223,250,0.7); }
        * { box-sizing: border-box; }
        body { margin:0; font-family:'Inter','Segoe UI',Arial,sans-serif; color:#e6eefc;
            background: radial-gradient(120% 100% at 50% 0%, #14305a, #0a1626 55%); }
        #timer-bar { position: sticky; top:0; z-index:50; display:none; align-items:center; justify-content:space-between;
            gap:12px; padding:12px 18px; background: rgba(10,22,40,0.85); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
            border-bottom:1px solid var(--border); }
        #timer-bar .t { font-weight:800; font-size:1.2rem; letter-spacing:0.02em; }
        #timer-bar .kicker { color:var(--cyan); font-size:0.66rem; font-weight:800; letter-spacing:0.16em; text-transform:uppercase; }
        .center { min-height: 88vh; display:flex; align-items:center; justify-content:center; padding:22px; }
        .card { width:min(100%,520px); background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:24px;
            box-shadow:0 24px 60px rgba(2,10,24,0.5); }
        h1 { font-size:1.35rem; margin:0 0 6px; } h2 { font-size:1rem; margin:16px 0 8px; }
        .muted { color:var(--muted); line-height:1.5; }
        .kicker { color:var(--cyan); font-size:0.7rem; font-weight:800; letter-spacing:0.16em; text-transform:uppercase; }
        label { display:block; font-weight:600; margin:14px 0 6px; color:#c2d8f6; }
        input[type=text] { width:100%; padding:12px 13px; border-radius:9px; font-size:16px; color:#e6eefc;
            background:rgba(255,255,255,0.07); border:1px solid var(--border); outline:none; }
        input:focus { border-color:var(--cyan); }
        .opts { display:flex; flex-wrap:wrap; gap:10px; margin-top:6px; }
        .opt { flex:1; min-width:90px; text-align:center; padding:14px 8px; border-radius:12px; cursor:pointer;
            background:rgba(255,255,255,0.05); border:1px solid var(--border); font-weight:700; }
        .opt.sel { background:linear-gradient(135deg,var(--blue),var(--cyan)); color:#04121f; border-color:transparent; }
        .check { display:flex; gap:10px; align-items:flex-start; margin-top:16px; font-weight:600; }
        .check input { width:22px; height:22px; margin-top:1px; }
        button.primary { width:100%; margin-top:18px; padding:13px; border:none; border-radius:10px; font-weight:800; font-family:inherit;
            font-size:1rem; cursor:pointer; background:linear-gradient(135deg,var(--blue),var(--cyan)); color:#04121f; }
        button.primary:disabled { opacity:0.5; cursor:not-allowed; }
        button.ghost { background:rgba(255,255,255,0.06); color:#e6eefc; border:1px solid var(--border); border-radius:9px;
            padding:9px 16px; font-weight:700; font-family:inherit; cursor:pointer; }
        .err { color:#fca5a5; margin-top:10px; font-size:0.9rem; }
        .scale { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
        .scale .n { flex:1; min-width:40px; text-align:center; padding:12px 0; border-radius:10px; cursor:pointer;
            background:rgba(255,255,255,0.05); border:1px solid var(--border); font-weight:700; }
        .scale .n.sel { background:linear-gradient(135deg,var(--blue),var(--cyan)); color:#04121f; }
        /* Feed */
        #feed { max-width:680px; margin:0 auto; padding:14px; display:none; }
        .post { background:var(--panel); border:1px solid var(--border); border-radius:16px; margin-bottom:16px; overflow:hidden; }
        .post .head { display:flex; align-items:center; gap:10px; padding:12px 14px; }
        .post .avatar { width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,var(--blue),var(--cyan)); }
        .post .who { font-weight:700; } .post .sub { color:var(--muted); font-size:0.8rem; }
        .post .media { height:300px; background:linear-gradient(135deg,#1b3a63,#10243f); }
        .post .body { padding:14px; color:#dbe7fb; line-height:1.55; }
    </style>
</head>
<body>
    <div id="timer-bar">
        <div><div class="kicker">Scroll study</div><div class="t" id="timer-text">--:--</div></div>
        <button class="ghost" id="finish-btn" type="button">Finish</button>
    </div>
    <div id="app"></div>
    <div id="feed"></div>
    <script type="module" src="/src/scroll/scroll.js"></script>
</body>
</html>
