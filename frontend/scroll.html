<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>FatigueIDPro — Scroll Study</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --blue:#2563eb; --blue-strong:#1d4ed8; --sky:#60a5fa;
            --text:#22293b; --heading:#1e3a8a; --muted:#5b6b8c;
            --surface:rgba(255,255,255,0.85); --border:rgba(37,99,235,0.16);
        }
        * { box-sizing: border-box; }
        body {
            margin:0; font-family:'Inter','Segoe UI',Arial,sans-serif; color:var(--text);
            min-height:100vh;
            background: linear-gradient(160deg, #ffffff 0%, #eaf2ff 45%, #dbeafe 100%);
        }
        /* Soft drifting glow blobs = a calm live background (matches the main app) */
        body::before, body::after {
            content:""; position:fixed; z-index:-1; pointer-events:none; border-radius:50%; filter:blur(60px);
        }
        body::before {
            width:70vw; height:70vw; left:-14vw; top:-16vh;
            background: radial-gradient(circle, rgba(37,99,235,0.20), transparent 62%);
            animation: blob-a 30s ease-in-out infinite alternate;
        }
        body::after {
            width:64vw; height:64vw; right:-16vw; bottom:-18vh;
            background: radial-gradient(circle, rgba(96,165,250,0.18), transparent 62%);
            animation: blob-b 40s ease-in-out infinite alternate;
        }
        @keyframes blob-a { from { transform:translate(0,0) scale(1); } to { transform:translate(10vw,8vh) scale(1.15); } }
        @keyframes blob-b { from { transform:translate(0,0) scale(1.1); } to { transform:translate(-9vw,-7vh) scale(1); } }
        @media (prefers-reduced-motion: reduce) { body::before, body::after { animation:none; } }

        #timer-bar { position: sticky; top:0; z-index:50; display:none; align-items:center; justify-content:space-between;
            gap:12px; padding:12px 18px; background: rgba(255,255,255,0.8); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
            border-bottom:1px solid var(--border); }
        #timer-bar .t { font-weight:800; font-size:1.2rem; letter-spacing:0.02em; color:var(--heading); }
        #timer-bar .kicker { color:var(--blue); font-size:0.66rem; font-weight:800; letter-spacing:0.16em; text-transform:uppercase; }
        .center { min-height: 88vh; display:flex; align-items:center; justify-content:center; padding:22px; }
        .card { width:min(100%,540px); background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:24px;
            -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
            box-shadow:0 24px 60px rgba(30,58,138,0.12); }
        h1 { font-size:1.35rem; margin:0 0 6px; color:var(--heading); } h2 { font-size:1rem; margin:16px 0 8px; color:var(--heading); }
        .muted { color:var(--muted); line-height:1.5; }
        .kicker { color:var(--blue); font-size:0.7rem; font-weight:800; letter-spacing:0.16em; text-transform:uppercase; }
        label { display:block; font-weight:600; margin:14px 0 6px; color:#334155; }
        .hint { font-weight:400; color:#94a3b8; }
        input[type=text], input[type=email], input[type=tel] { width:100%; padding:12px 13px; border-radius:10px; font-size:16px; color:var(--text);
            background:#ffffff; border:1px solid rgba(37,99,235,0.28); outline:none; }
        input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(37,99,235,0.15); }
        .opts { display:flex; flex-wrap:wrap; gap:10px; margin-top:6px; }
        .opt { flex:1 1 100px; min-width:90px; text-align:center; padding:14px 8px; border-radius:12px; cursor:pointer;
            background:#ffffff; border:1px solid var(--border); font-weight:700; color:#334155; }
        .opt.sel { background:linear-gradient(135deg,var(--blue),var(--blue-strong)); color:#fff; border-color:transparent; }
        .check { display:flex; gap:10px; align-items:flex-start; margin-top:16px; font-weight:600; color:#1e293b; }
        .check input { width:22px; height:22px; margin-top:1px; flex:0 0 22px; }
        button.primary { width:100%; margin-top:18px; padding:14px; border:none; border-radius:10px; font-weight:800; font-family:inherit;
            font-size:1rem; cursor:pointer; background:linear-gradient(135deg,var(--blue),var(--blue-strong)); color:#fff; box-shadow:0 8px 20px rgba(37,99,235,0.25); }
        button.primary:disabled { opacity:0.5; cursor:not-allowed; }
        button.ghost { background:#ffffff; color:var(--heading); border:1px solid var(--border); border-radius:9px;
            padding:9px 16px; font-weight:700; font-family:inherit; cursor:pointer; }
        .err { color:#dc2626; margin-top:10px; font-size:0.9rem; }
        .pill-id { display:inline-block; font-weight:800; letter-spacing:0.06em; color:var(--blue-strong);
            background:rgba(37,99,235,0.10); border:1px solid var(--border); padding:4px 12px; border-radius:999px; }
        .scale { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
        .scale .n { flex:1 1 40px; min-width:40px; text-align:center; padding:12px 0; border-radius:10px; cursor:pointer;
            background:#ffffff; border:1px solid var(--border); font-weight:700; color:#334155; }
        .scale .n.sel { background:linear-gradient(135deg,var(--blue),var(--blue-strong)); color:#fff; }
        /* Feed */
        #feed { max-width:680px; margin:0 auto; padding:14px; display:none; }
        .post { background:#ffffff; border:1px solid var(--border); border-radius:16px; margin-bottom:16px; overflow:hidden;
            box-shadow:0 8px 22px rgba(30,58,138,0.06); }
        .post .head { display:flex; align-items:center; gap:10px; padding:12px 14px; }
        .post .avatar { width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,var(--blue),var(--sky)); flex:0 0 38px; }
        .post .who { font-weight:700; color:var(--heading); } .post .sub { color:var(--muted); font-size:0.8rem; }
        .post .media { height:300px; background:linear-gradient(135deg,#dbeafe,#bfdbfe); }
        .post .body { padding:14px; color:#33415c; line-height:1.55; }

        /* Phone fit */
        @media (max-width: 560px) {
            .center { padding:14px; min-height:92vh; }
            .card { padding:18px; border-radius:14px; }
            h1 { font-size:1.2rem; }
            .opt { padding:12px 6px; }
            #timer-bar { padding:10px 14px; }
            .post .media { height:210px; }
        }
    </style>
</head>
<body>
    <div id="timer-bar">
        <div><div class="kicker">Scroll study</div><div class="t" id="timer-text">--:--</div></div>
        <button class="ghost" id="finish-btn" type="button">Finish</button>
    </div>
    <div id="app"></div>
    <div id="feed"></div>
    <script type="module" src="/src/scroll/scroll.js"></script>
</body>
</html>
